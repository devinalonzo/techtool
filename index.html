<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1116">
<meta http-equiv="refresh" content="0; url=https://ifixgas.com/tech/">
<title>Tech Tool</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#0e1116; color:#e6edf3; font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  a{ color:#2f81f7; }
</style>
<script>
  // Retire the old worker + caches from any device that still has the previous app installed,
  // then move the browser to the new home.
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    }
  } catch (e) {}
  location.replace('https://ifixgas.com/tech/');
</script>
</head>
<body>
<p>Tech Tool has moved. <a href="https://ifixgas.com/tech/">Open Tech Tool</a>.</p>
</body>
</html>
